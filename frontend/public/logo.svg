    <linearGradient id="globe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecbd63"/>
      <stop offset="1" stop-color="#c4852a"/>
    </linearGradient>
    <clipPath id="sphere">
      <circle cx="240" cy="290" r="138"/>
    </clipPath>
  </defs>

  <circle cx="240" cy="290" r="138" fill="url(#globe)"/>
  <g clip-path="url(#sphere)" fill="none" stroke="#2a2c2e" stroke-opacity="0.32" stroke-width="10">
    <ellipse cx="240" cy="290" rx="58" ry="138"/>
    <path d="M240 152v276M102 244h276M102 336h276"/>
  </g>

  <path d="M128 384C150 270 230 188 356 166" fill="none" stroke="#5fd4e4" stroke-width="16"
