parameters:
  - name: id
    in: path
    required: true
    schema: { type: string }
put:
  tags: [admin]
  operationId: resetUserPassword
  summary: Set a new password for another account
  description: |
    Ends all sessions of the account and makes it choose its own password at
    the next login.
  requestBody:
    required: true
    content:
      application/json:
        schema: { $ref: '../components/schemas/admin.yaml#/PasswordReset' }
  responses:
    '204': { description: Reset }
    '400': { $ref: '../components/responses.yaml#/BadRequest' }
    '401': { $ref: '../components/responses.yaml#/Unauthorized' }
    '403': { $ref: '../components/responses.yaml#/Forbidden' }
    '404': { $ref: '../components/responses.yaml#/NotFound' }
